[project]
name = "ms-hemocentros"
version = "0.1.0"
description = "Microsserviço de Hemocentros & CQRS - StarTech"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pymongo>=4.9,<5",
    "aio-pika>=9.4,<10",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
hemocentros-worker = "hemocentros.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hemocentros.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
# O Starlette sugere `httpx2` para o TestClient; a troca depende do FastAPI suportá-lo. Até lá, o aviso
# é ruído (não afeta o comportamento) e fica silenciado só aqui.
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pyflakes/pycodestyle, imports ordenados, sintaxe moderna e bugbear.
# Captura ampla de Exception é intencional nos laços de resiliência (workers, health), então BLE fica de fora.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # linhas longas de dados/asserções nos testes

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
