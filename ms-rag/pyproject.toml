[project]
name = "ms-rag"
version = "0.1.0"
description = "Assistente do doador com RAG (Portaria MS nº 5/2017), LangChain e Ollama - StarTech"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "langchain-core>=1.2.22,<2",  # 1.2.22 corrige a CVE-2026-34070 (Trivy)
    "langchain-ollama>=1.1,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag.data" = ["*.md"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
