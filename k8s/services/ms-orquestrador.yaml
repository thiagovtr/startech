# ms-orquestrador (SAGA + Transactional Outbox, ADR-006). Réplicas seguras: SKIP LOCKED, lock otimista e reivindicação.
# Imagem local: docker build -t startech/ms-orquestrador:dev ./ms-orquestrador  (minikube: minikube image load startech/ms-orquestrador:dev;
# kind: kind load docker-image startech/ms-orquestrador:dev)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-orquestrador
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-orquestrador, app.kubernetes.io/component: backend}
data:
  ORQUESTRADOR_AGENDAMENTOS_URL: "http://ms-agendamentos:8082"
  ORQUESTRADOR_DOADORES_URL: "http://ms-doadores:8081"
  ORQUESTRADOR_PASSO3_AGUARDAR_RESPOSTA: "true"  # aguarda a resposta do ms-comunicacao (timeout de 30 s -> compensação)
  LOG_FORMAT: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-orquestrador
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-orquestrador, app.kubernetes.io/component: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ms-orquestrador}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-orquestrador, app.kubernetes.io/component: backend}
    spec:
      # Sem variáveis automáticas <SERVICE>_PORT=tcp://...: colidem com a config (ex.: BFF_MOBILE_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # usuário `app` criado no Dockerfile
      containers:
        - name: ms-orquestrador
          image: startech/ms-orquestrador:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8003}
          envFrom:
            - configMapRef: {name: ms-orquestrador}
            - secretRef: {name: ms-orquestrador}  # URLs com credenciais (k8s/base/secrets-dev3.yaml)
          # liveness: o processo está vivo (sempre 200, não depende de banco);
          # readiness: tira o pod do Service enquanto uma dependência obrigatória estiver fora
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-orquestrador
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-orquestrador, app.kubernetes.io/component: backend}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ms-orquestrador}
  ports:
    - {name: http, port: 8003, targetPort: http}
