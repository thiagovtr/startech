# BFF Web (sem estado e sem banco). Recebe tráfego só do API Gateway.
# Imagem local: docker build -t startech/bff-web:dev ./bff-web  (minikube: minikube image load startech/bff-web:dev;
# kind: kind load docker-image startech/bff-web:dev)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff-web
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: bff-web, app.kubernetes.io/component: bff}
data:
  BFF_WEB_HEMOCENTROS_URL: "http://ms-hemocentros:8000"
  BFF_WEB_EXIGIR_PAPEL: "true"
  LOG_FORMAT: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-web
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: bff-web, app.kubernetes.io/component: bff}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: bff-web}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: bff-web, app.kubernetes.io/component: bff}
    spec:
      # Sem variáveis automáticas <SERVICE>_PORT=tcp://...: colidem com a config (ex.: BFF_MOBILE_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # usuário `app` criado no Dockerfile
      containers:
        - name: bff-web
          image: startech/bff-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8002}
          envFrom:
            - configMapRef: {name: bff-web}
          # liveness: o processo está vivo (sempre 200, não depende de banco);
          # readiness: tira o pod do Service enquanto uma dependência obrigatória estiver fora
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: bff-web
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: bff-web, app.kubernetes.io/component: bff}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: bff-web}
  ports:
    - {name: http, port: 8002, targetPort: http}
