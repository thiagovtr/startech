# ms-hemocentros (CQRS: escrita PostgreSQL + Outbox, leitura MongoDB). Escala horizontalmente (ver HPA).
# Imagem local: docker build -t startech/ms-hemocentros:dev ./ms-hemocentros  (minikube: minikube image load startech/ms-hemocentros:dev;
# kind: kind load docker-image startech/ms-hemocentros:dev)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-hemocentros
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-hemocentros, app.kubernetes.io/component: backend}
data:
  HEMOCENTROS_MONGO_URL: "mongodb://mongo:27017"
  HEMOCENTROS_MONGO_DB: "hemocentros"
  HEMOCENTROS_RABBITMQ_EXCHANGE: "startech.events.exchange"
  HEMOCENTROS_RABBITMQ_EXCHANGE_TYPE: "topic"
  HEMOCENTROS_RABBITMQ_DLQ_HABILITADA: "true"
  LOG_FORMAT: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-hemocentros
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-hemocentros, app.kubernetes.io/component: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ms-hemocentros}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-hemocentros, app.kubernetes.io/component: backend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # usuário `app` criado no Dockerfile
      containers:
        - name: ms-hemocentros
          image: startech/ms-hemocentros:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: ms-hemocentros}
            - secretRef: {name: ms-hemocentros}  # URLs com credenciais (k8s/base/secrets-dev3.yaml)
          # liveness: o processo está vivo (sempre 200, não depende de banco);
          # readiness: tira o pod do Service enquanto uma dependência obrigatória estiver fora
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 200m, memory: 192Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-hemocentros
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-hemocentros, app.kubernetes.io/component: backend}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ms-hemocentros}
  ports:
    - {name: http, port: 8000, targetPort: http}
