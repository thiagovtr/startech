# Keycloak (identidade OIDC, JWT RS256) com o realm `startech` embutido na imagem (importado na subida).
# Imagem local: docker build -t startech/keycloak:dev ./keycloak  (minikube: minikube image load startech/keycloak:dev)
# Acesso externo só pelo Gateway (/realms/** -> keycloak:8080). Console admin: kubectl port-forward svc/keycloak 8089:8080
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: keycloak, app.kubernetes.io/component: identity}
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://db-keycloak:5432/keycloak"
  KC_HOSTNAME_STRICT: "false"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HTTP_ENABLED: "true"
  KC_HEALTH_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: keycloak, app.kubernetes.io/component: identity}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: keycloak, app.kubernetes.io/component: identity}
    spec:
      # Sem variáveis automáticas <SERVICE>_PORT=tcp://...: colidem com a config (ex.: BFF_MOBILE_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # usuário padrão da imagem do Keycloak
      containers:
        - name: keycloak
          image: startech/keycloak:dev
          imagePullPolicy: IfNotPresent
          args: ["start", "--optimized", "--import-realm"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}  # /health/* no Keycloak 26+
          envFrom:
            - configMapRef: {name: keycloak}
            - secretRef: {name: keycloak}  # usuário/senha do banco e do admin
          startupProbe:  # importa o realm e migra o banco na primeira subida (pode levar ~1 min)
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: keycloak, app.kubernetes.io/component: identity}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
