# ms-agendamentos (Java 21 / Spring Boot): slots e agendamentos (passos 1 e 4 da SAGA, HATEOAS).
# Imagem local: docker build -t startech/ms-agendamentos:dev ./ms-agendamentos  (minikube: minikube image load startech/ms-agendamentos:dev)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-agendamentos
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-agendamentos, app.kubernetes.io/component: backend}
data:
  MS_AGENDAMENTOS_PORT: "8082"
  MS_AGENDAMENTOS_DB_URL: "jdbc:postgresql://db-agendamentos:5432/agendamentos"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-agendamentos
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-agendamentos, app.kubernetes.io/component: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ms-agendamentos}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-agendamentos, app.kubernetes.io/component: backend}
    spec:
      # Sem variáveis automáticas <SERVICE>_PORT=tcp://...: colidem com a config (ex.: BFF_MOBILE_PORT).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # usuário `app` criado no Dockerfile
      containers:
        - name: ms-agendamentos
          image: startech/ms-agendamentos:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8082}
          envFrom:
            - configMapRef: {name: ms-agendamentos}
            - secretRef: {name: ms-agendamentos}  # credenciais (k8s/base/secrets-dev4.yaml)
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-agendamentos
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-agendamentos, app.kubernetes.io/component: backend}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ms-agendamentos}
  ports:
    - {name: http, port: 8082, targetPort: http}
