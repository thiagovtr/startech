# Ingress (Ingress-NGINX): toda requisição externa vai para o API Gateway, que valida o JWT e roteia
# /api/mobile/** -> bff-mobile, /api/web/** -> bff-web e /realms/** -> keycloak.
# Os BFFs NÃO são expostos: eles confiam no X-User-Id injetado pelo Gateway (ADR-005).
# minikube: `minikube addons enable ingress` e adicione `$(minikube ip) startech.local` ao /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: startech
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: startech-ingress, app.kubernetes.io/component: edge}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: startech.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 8080}
