# RabbitMQ (broker de eventos e comandos da SAGA/CQRS): StatefulSet com volume persistente.
# Nome de host estável (rabbitmq-0) preserva os dados do nó entre reinícios. As filas e exchanges são
# declaradas pelos próprios serviços (sem arquivo central de definições; contratos §2.1).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: broker}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}  # acesso: kubectl port-forward svc/rabbitmq 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: broker}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: broker}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          envFrom:
            - secretRef: {name: rabbitmq}  # RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: dados, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
