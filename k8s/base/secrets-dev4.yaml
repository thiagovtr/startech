# Secrets da infraestrutura core, dos serviços Java e do ms-comunicacao.
# Valores APENAS de desenvolvimento local (os mesmos do .env.example / padrões do compose.yaml). Em qualquer
# outro ambiente, troque-os (ex.: kubectl create secret generic ... --from-literal=...) e não versione os reais.
# A senha do RabbitMQ (guest) precisa ser a mesma das URLs AMQP de k8s/base/secrets-dev3.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: rabbitmq}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
---
apiVersion: v1
kind: Secret
metadata:
  name: db-keycloak
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: db-keycloak}
type: Opaque
stringData:
  POSTGRES_USER: keycloak
  POSTGRES_PASSWORD: keycloak
  POSTGRES_DB: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: keycloak}
type: Opaque
stringData:
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: keycloak
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
---
