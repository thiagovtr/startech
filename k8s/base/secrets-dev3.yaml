# Secrets dos serviços do Dev 3 (ms-hemocentros, ms-orquestrador e seus bancos).
# Valores APENAS de desenvolvimento local (os mesmos do .env.example). Em qualquer outro ambiente, troque-os
# (ex.: kubectl create secret generic ... --from-literal=...) e não versione os valores reais.
# As URLs ficam inteiras no Secret porque contêm usuário e senha (os serviços não têm credencial padrão no código).
apiVersion: v1
kind: Secret
metadata:
  name: db-hemocentros
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: db-hemocentros}
type: Opaque
stringData:
  POSTGRES_USER: hemocentros
  POSTGRES_PASSWORD: hemocentros
  POSTGRES_DB: hemocentros
---
apiVersion: v1
kind: Secret
metadata:
  name: ms-hemocentros
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-hemocentros}
type: Opaque
stringData:
  HEMOCENTROS_POSTGRES_URL: postgresql+asyncpg://hemocentros:hemocentros@db-hemocentros:5432/hemocentros
  HEMOCENTROS_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
---
apiVersion: v1
kind: Secret
metadata:
  name: db-orquestrador
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: db-orquestrador}
type: Opaque
stringData:
  POSTGRES_USER: orquestrador
  POSTGRES_PASSWORD: orquestrador
  POSTGRES_DB: orquestrador
---
apiVersion: v1
kind: Secret
metadata:
  name: ms-orquestrador
  namespace: startech
  labels: {app.kubernetes.io/part-of: startech, app.kubernetes.io/name: ms-orquestrador}
type: Opaque
stringData:
  ORQUESTRADOR_POSTGRES_URL: postgresql+asyncpg://orquestrador:orquestrador@db-orquestrador:5432/orquestrador
  ORQUESTRADOR_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
