# Sobreposição do compose.yaml para o E2E da SAGA (scripts/e2e-saga.sh). NÃO faz parte da stack normal.
# Substitui ms-agendamentos e ms-doadores, para o orquestrador, por participantes simulados que implementam
# os contratos da SAGA (contratos §2), enquanto os endpoints reais não existem.
# Os caminhos são relativos ao compose.yaml da raiz (primeiro arquivo).
services:
  participantes-fake:
    build: ./ms-orquestrador  # reaproveita a imagem do orquestrador (já tem FastAPI e uvicorn)
    command: ["uvicorn", "participantes_fake:app", "--app-dir", "/fake", "--host", "0.0.0.0", "--port", "9000"]
    volumes:
      - ./scripts/e2e-saga:/fake:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [startech-net-api]

  ms-orquestrador:
    environment:
      ORQUESTRADOR_AGENDAMENTOS_URL: http://participantes-fake:9000
      ORQUESTRADOR_DOADORES_URL: http://participantes-fake:9000
    depends_on:
      participantes-fake:
        condition: service_healthy
