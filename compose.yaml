# StarTech - Docker Compose raiz.
# Subida completa: docker compose up -d --build
#
# Este arquivo é compartilhado. Cada Dev insere sua parte nos locais marcados:
#   [DEV 1] infraestrutura core e borda (RabbitMQ, Keycloak, API Gateway)
#   [DEV 2] ms-doadores, ms-agendamentos e seus PostgreSQL
#   [DEV 4] Ollama, ms-comunicacao e seu PostgreSQL
# Os serviços do Dev 3 (ms-hemocentros, bff-mobile, bff-web e bancos) já estão abaixo.

name: startech

services:
  # ===========================================================================
  # [DEV 1] Infraestrutura Core e Borda (RabbitMQ, Keycloak, API Gateway)
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [startech-net-api]

  db-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - db-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [startech-net-db]

  keycloak:
    build: ./keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8089}:8080"
    depends_on:
      db-keycloak:
        condition: service_healthy
    networks: [startech-net-db, startech-net-api]

  gateway:
    build: ./gateway
    environment:
      GATEWAY_PORT: 8080
      GATEWAY_JWK_SET_URI: http://keycloak:8080/realms/startech/protocol/openid-connect/certs
      GATEWAY_BFF_MOBILE_URI: http://bff-mobile:8001
      GATEWAY_BFF_WEB_URI: http://bff-web:8002
      GATEWAY_KEYCLOAK_URI: http://keycloak:8080
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_CAPACITY: ${GATEWAY_RATE_LIMIT_CAPACITY:-60}
      GATEWAY_RATE_LIMIT_REFILL_PER_SEC: ${GATEWAY_RATE_LIMIT_REFILL_PER_SEC:-30}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      bff-mobile:
        condition: service_healthy
      bff-web:
        condition: service_healthy
    networks: [startech-net-api]

  # ---------------------------------------------------------------------------
  # [DEV 2] Parte do Dev 2 deve ser inserida aqui:
  #   ms-doadores (8081), ms-agendamentos, db-doadores, db-agendamentos.
  #   Quando existir ms-doadores, o bff-mobile deve receber BFF_MOBILE_DOADORES_URL
  #   e passar a depender dele.
  # ---------------------------------------------------------------------------
  db-doadores:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doadores
      POSTGRES_PASSWORD: ${DOADORES_DB_PASSWORD:-doadores}
      POSTGRES_DB: doadores
    volumes:
      - db-doadores-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doadores -d doadores"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [startech-net-db]

  ms-doadores:
    build: ./ms-doadores
    environment:
      MS_DOADORES_PORT: 8081
      MS_DOADORES_DB_URL: jdbc:postgresql://db-doadores:5432/doadores
      MS_DOADORES_DB_USERNAME: doadores
      MS_DOADORES_DB_PASSWORD: ${DOADORES_DB_PASSWORD:-doadores}
    depends_on:
      db-doadores:
        condition: service_healthy
    networks: [startech-net-db, startech-net-api]

  db-agendamentos:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agendamentos
      POSTGRES_PASSWORD: ${AGENDAMENTOS_DB_PASSWORD:-agendamentos}
      POSTGRES_DB: agendamentos
    volumes:
      - db-agendamentos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamentos -d agendamentos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [startech-net-db]

  ms-agendamentos:
    build: ./ms-agendamentos
    environment:
      MS_AGENDAMENTOS_PORT: 8082
      MS_AGENDAMENTOS_DB_URL: jdbc:postgresql://db-agendamentos:5432/agendamentos
      MS_AGENDAMENTOS_DB_USERNAME: agendamentos
      MS_AGENDAMENTOS_DB_PASSWORD: ${AGENDAMENTOS_DB_PASSWORD:-agendamentos}
    depends_on:
      db-agendamentos:
        condition: service_healthy
    networks: [startech-net-db, startech-net-api]

  # ===========================================================================
  # [DEV 4] Comunicação (participante do passo 3 da SAGA) e seu PostgreSQL
  #   (o Ollama entra aqui na Fase B)
  # ===========================================================================
  db-comunicacao:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comunicacao
      POSTGRES_PASSWORD: ${COMUNICACAO_DB_PASSWORD:-comunicacao}
      POSTGRES_DB: comunicacao
    volumes:
      - db-comunicacao-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunicacao -d comunicacao"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [startech-net-db]

  # Sem porta no host: consome comandos da SAGA pelo RabbitMQ e expõe o histórico na rede interna (8004).
  ms-comunicacao:
    build: ./ms-comunicacao
    environment:
      COMUNICACAO_POSTGRES_URL: postgresql+asyncpg://comunicacao:${COMUNICACAO_DB_PASSWORD:-comunicacao}@db-comunicacao:5432/comunicacao
      COMUNICACAO_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      # Antecedência do lembrete (ISO 8601). Padrão D-1; na demonstração, ex.: PT30S.
      COMUNICACAO_LEMBRETE_ANTECEDENCIA: ${COMUNICACAO_LEMBRETE_ANTECEDENCIA:-P1D}
      # Só para demonstrar a compensação pelo passo 3 (vazio = desligado).
      COMUNICACAO_SIMULAR_FALHA_DOADORES: ${COMUNICACAO_SIMULAR_FALHA_DOADORES:-}
    depends_on:
      db-comunicacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [startech-net-db, startech-net-api]


  # ===========================================================================
  # [DEV 3] Hemocentros, BFFs e bancos
  # ===========================================================================
  db-hemocentros:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hemocentros
      POSTGRES_PASSWORD: ${HEMOCENTROS_DB_PASSWORD:-hemocentros}
      POSTGRES_DB: hemocentros
    volumes:
      - db-hemocentros-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemocentros -d hemocentros"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [startech-net-db]

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [startech-net-db]

  ms-hemocentros:
    build: ./ms-hemocentros
    environment:
      HEMOCENTROS_POSTGRES_URL: postgresql+asyncpg://hemocentros:${HEMOCENTROS_DB_PASSWORD:-hemocentros}@db-hemocentros:5432/hemocentros
      HEMOCENTROS_MONGO_URL: mongodb://mongo:27017
      HEMOCENTROS_MONGO_DB: hemocentros
      # Publicador do Outbox. [DEV 1] o serviço `rabbitmq` deve existir; sem ele, o publicador
      # apenas registra o erro e tenta de novo (o serviço continua no ar).
      HEMOCENTROS_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      HEMOCENTROS_RABBITMQ_EXCHANGE: startech.events.exchange
      HEMOCENTROS_RABBITMQ_EXCHANGE_TYPE: topic
      HEMOCENTROS_RABBITMQ_DLQ_HABILITADA: "true"
    depends_on:
      db-hemocentros:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [startech-net-db, startech-net-api]

  db-orquestrador:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orquestrador
      POSTGRES_PASSWORD: ${ORQUESTRADOR_DB_PASSWORD:-orquestrador}
      POSTGRES_DB: orquestrador
    volumes:
      - db-orquestrador-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquestrador -d orquestrador"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [startech-net-db]

  # Orquestrador da SAGA de agendamento (ADR-006): sem porta no host, acessado pelo bff-mobile.
  ms-orquestrador:
    build: ./ms-orquestrador
    environment:
      ORQUESTRADOR_POSTGRES_URL: postgresql+asyncpg://orquestrador:${ORQUESTRADOR_DB_PASSWORD:-orquestrador}@db-orquestrador:5432/orquestrador
      ORQUESTRADOR_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      ORQUESTRADOR_AGENDAMENTOS_URL: http://ms-agendamentos:8082
      ORQUESTRADOR_DOADORES_URL: http://ms-doadores:8081
      # Passo 3 real: aguarda a resposta do ms-comunicacao (timeout de 30 s -> compensação).
      ORQUESTRADOR_PASSO3_AGUARDAR_RESPOSTA: "true"
    depends_on:
      db-orquestrador:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [startech-net-db, startech-net-api]

  bff-mobile:
    build: ./bff-mobile
    environment:
      BFF_MOBILE_HEMOCENTROS_URL: http://ms-hemocentros:8000
      BFF_MOBILE_DOADORES_URL: http://ms-doadores:8081
      BFF_MOBILE_ORQUESTRADOR_URL: http://ms-orquestrador:8003
      BFF_MOBILE_EXIGIR_PAPEL: "true"
    depends_on:
      ms-hemocentros:
        condition: service_healthy
    networks: [startech-net-api]

  bff-web:
    build: ./bff-web
    environment:
      BFF_WEB_HEMOCENTROS_URL: http://ms-hemocentros:8000
      BFF_WEB_EXIGIR_PAPEL: "true"
    depends_on:
      ms-hemocentros:
        condition: service_healthy
    networks: [startech-net-api]

# Redes compartilhadas (nomes definidos no plano: startech-net-db e startech-net-api).
# [DEV 1] pode ajustar/estender as redes aqui.
networks:
  startech-net-db:
    name: startech-net-db
  startech-net-api:
    name: startech-net-api

# Volumes persistentes. [DEV 1/2/4] adicionam os volumes dos seus serviços aqui.
volumes:
  rabbitmq-data:
  db-keycloak-data:
  db-hemocentros-data:
  mongo-data:
  db-doadores-data:
  db-agendamentos-data:
  db-orquestrador-data:
  db-comunicacao-data:
