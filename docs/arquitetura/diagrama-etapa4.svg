<text x="665.0" y="445.0" class="t">RabbitMQ — exchange startech.events.exchange (topic) + DLX startech.events.dlx</text>
<rect x="10" y="620" width="1220" height="130" rx="10" fill="#fff" stroke="#ddd"/>
<text x="26" y="646" class="lg" text-anchor="start"><tspan font-weight="600">→ sólida:</tspan> HTTP REST /api/v1 (correlation id X-Request-Id ponta a ponta)</text>
<text x="26" y="668" class="lg" text-anchor="start"><tspan font-weight="600">⇢ laranja:</tspan> RabbitMQ via Transactional Outbox: comandos/respostas da SAGA (comunicacao.saga.comandos, orquestrador.saga.respostas), evento hemocentros.campanha.criada → projeção MongoDB</text>
<text x="26" y="690" class="lg" text-anchor="start"><tspan font-weight="600">⇢ roxa:</tspan> ferramenta LangChain do ms-rag: campanhas vigentes (leitura CQRS) para "Onde posso doar hoje?"</text>
<text x="26" y="712" class="lg" text-anchor="start"><tspan font-weight="600">SAGA:</tspan> 1 reserva vaga (agendamentos) · 2 RN01 + trava (doadores) · 3 lembrete D-1 + confirmação (comunicacao, assíncrono) · 4 confirma; compensações 3→2→1</text>
<text x="26" y="734" class="lg" text-anchor="start"><tspan font-weight="600">Execução:</tspan> docker compose up -d --build  ·  Kubernetes: k8s/ (Ingress → Gateway; HPA no ms-hemocentros)</text>
